# ============================================================
# AI-ETL Platform - 统一服务编排
# 架构: ETL Worker + Query API + Parser Service + 基础设施
# 启动: docker compose up -d
# ============================================================

services:
  # ==========================================
  # 基础设施层
  # ==========================================

  kafka:
    image: bitnamilegacy/kafka:3.7.1
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Evictable cache only (semantic retrieval cache). allkeys-lru is correct here:
  # losing a cached result costs one extra retrieval, nothing more.
  redis-cache:
    image: redis:7-alpine
    ports:
      - "${REDIS_CACHE_HOST_PORT:-6379}:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Durable state: Agent runs, approval audit, fencing tokens, idempotency keys,
  # checkpoints, task status, ES retry queue.
  # noeviction is mandatory — evicting a fencing token silently defeats the
  # stale-write rejection in agent.Orchestrator, and evicting an approval record
  # destroys a compliance artifact. AOF everysec bounds loss to ~1s on crash.
  redis-state:
    image: redis:7-alpine
    ports:
      - "${REDIS_STATE_HOST_PORT:-6380}:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_state_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "${QDRANT_HTTP_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'cat < /dev/null > /dev/tcp/127.0.0.1/9200'"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 可观测性
  # ==========================================

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "${JAEGER_UI_HOST_PORT:-16686}:16686"  # UI
      - "${JAEGER_OTLP_GRPC_HOST_PORT:-4317}:4317"  # OTLP gRPC
      - "${JAEGER_OTLP_HTTP_HOST_PORT:-4318}:4318"  # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - alertmanager

  alertmanager:
    build:
      context: ./infrastructure/alertmanager
      dockerfile: Dockerfile
    image: ai-etl-platform-alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    secrets:
      - alert_webhook_token
    command:
      - '--storage.path=/alertmanager'
    depends_on:
      alert-webhook-service:
        condition: service_healthy
    restart: unless-stopped

  alert-webhook-service:
    build:
      context: ./services/alert-webhook-service
      dockerfile: Dockerfile
    environment:
      - HOST=0.0.0.0
      - PORT=8092
      - LOG_LEVEL=${ALERT_WEBHOOK_LOG_LEVEL:-INFO}
      - ALERT_DELIVERY_TIMEOUT_SECONDS=${ALERT_DELIVERY_TIMEOUT_SECONDS:-5}
      - ALERT_WEBHOOK_TOKEN_FILE=/run/secrets/alert_webhook_token
      - WECOM_WEBHOOK_URL_FILE=/run/secrets/wecom_webhook_url
      - DINGTALK_WEBHOOK_URL_FILE=/run/secrets/dingtalk_webhook_url
      - DINGTALK_SECRET_FILE=/run/secrets/dingtalk_secret
    secrets:
      - alert_webhook_token
      - wecom_webhook_url
      - dingtalk_webhook_url
      - dingtalk_secret
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana_admin_password
    depends_on:
      - prometheus
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "${KAFKA_UI_HOST_PORT:-8090}:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ==========================================
  # 应用服务层
  # ==========================================

  # Python Parser Service
  parser-service:
    build:
      context: ./services/doc-parser-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PARSER_HOST_PORT:-8000}:8000"
    volumes:
      - upload_data:/data:ro
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-staging}
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - INTERNAL_API_TOKEN=${PARSER_INTERNAL_TOKEN:-}
      - INTERNAL_API_TOKEN_FILE=/run/secrets/parser_internal_token
      - MIN_CHUNK_SIZE=128
      - MAX_CHUNK_SIZE=4000
      - CHUNK_OVERLAP=200
      - LOG_LEVEL=INFO
    secrets:
      - parser_internal_token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Go ETL Worker
  etl-worker:
    build:
      context: ./services/etl-worker
      dockerfile: Dockerfile
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-staging}
      - WORKER_METRICS_PORT=${WORKER_METRICS_PORT:-8081}
      - PIPELINE_MAX_WORKERS=${PIPELINE_MAX_WORKERS:-10}
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-doc-processing}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID:-etl-pipeline}
      - KAFKA_DLQ_TOPIC=${KAFKA_DLQ_TOPIC:-doc-processing-dlq}
      - STORE_ENDPOINT=http://qdrant:6333
      - STORE_COLLECTION=${STORE_COLLECTION:-documents}
      # Worker touches only durable state (checkpoint, task status, ES retry queue).
      - REDIS_STATE_ADDR=redis-state:6379
      - REDIS_STATE_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_STATE_PASSWORD_FILE=/run/secrets/redis_password
      - REDIS_STATE_DB=${REDIS_STATE_DB:-0}
      - ES_ADDRESS=${ES_ADDRESS:-http://elasticsearch:9200}
      - ES_API_KEY=${ES_API_KEY:-}
      - ES_API_KEY_FILE=/run/secrets/es_api_key
      - ES_INDEX=${ES_INDEX:-documents_text}
      - ES_QUEUE_KEY=${ES_QUEUE_KEY:-es:index:retry}
      - ES_DEADLETTER_KEY=${ES_DEADLETTER_KEY:-es:index:deadletter}
      - ES_REPLAY_PERIOD=${ES_REPLAY_PERIOD:-2s}
      - ES_MAX_RETRIES=${ES_MAX_RETRIES:-12}
      - ES_RETRY_BASE_BACKOFF=${ES_RETRY_BASE_BACKOFF:-2s}
      - ES_RETRY_MAX_BACKOFF=${ES_RETRY_MAX_BACKOFF:-5m}
      - ES_RETRY_JITTER=${ES_RETRY_JITTER:-0.2}
      - PARSER_ENDPOINT=http://parser-service:8000
      - PARSER_INTERNAL_TOKEN=${PARSER_INTERNAL_TOKEN:-}
      - PARSER_INTERNAL_TOKEN_FILE=/run/secrets/parser_internal_token
      - EMBED_ENDPOINT=${EMBED_ENDPOINT:-http://host.docker.internal:11434/api/embeddings}
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - EMBED_API_KEY_FILE=/run/secrets/embed_api_key
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - EMBED_DIMENSION=${EMBED_DIMENSION:-768}
      - EMBED_RATE_LIMIT=${EMBED_RATE_LIMIT:-50}
      - STORE_API_KEY=${STORE_API_KEY:-}
      - STORE_API_KEY_FILE=/run/secrets/store_api_key
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_ACCESS_KEY_FILE=/run/secrets/s3_access_key
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_SECRET_KEY_FILE=/run/secrets/s3_secret_key
      - S3_BUCKET=documents
      - S3_USE_SSL=${S3_USE_SSL:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    secrets:
      - parser_internal_token
      - embed_api_key
      - store_api_key
      - redis_password
      - es_api_key
      - s3_access_key
      - s3_secret_key
    depends_on:
      kafka:
        condition: service_healthy
      redis-state:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      parser-service:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Go Query API
  query-api:
    build:
      context: ./services/etl-worker
      dockerfile: Dockerfile.api
    ports:
      - "${QUERY_API_HOST_PORT:-8080}:8080"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-staging}
      - HEALTH_PORT=8080
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - HTTP_READ_TIMEOUT=${HTTP_READ_TIMEOUT:-15s}
      - HTTP_READ_HEADER_TIMEOUT=${HTTP_READ_HEADER_TIMEOUT:-10s}
      - HTTP_WRITE_TIMEOUT=${HTTP_WRITE_TIMEOUT:-60s}
      - HTTP_IDLE_TIMEOUT=${HTTP_IDLE_TIMEOUT:-120s}
      - HTTP_MAX_HEADER_BYTES=${HTTP_MAX_HEADER_BYTES:-1048576}
      - IDEMPOTENCY_TTL=${IDEMPOTENCY_TTL:-24h}
      # API uses both: evictable semantic cache and durable Agent/idempotency state.
      - REDIS_CACHE_ADDR=redis-cache:6379
      - REDIS_CACHE_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_CACHE_PASSWORD_FILE=/run/secrets/redis_password
      - REDIS_CACHE_DB=${REDIS_CACHE_DB:-0}
      - REDIS_STATE_ADDR=redis-state:6379
      - REDIS_STATE_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_STATE_PASSWORD_FILE=/run/secrets/redis_password
      - REDIS_STATE_DB=${REDIS_STATE_DB:-0}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-doc-processing}
      - STORE_ENDPOINT=http://qdrant:6333
      - STORE_COLLECTION=${STORE_COLLECTION:-documents}
      - STORE_API_KEY=${STORE_API_KEY:-}
      - STORE_API_KEY_FILE=/run/secrets/store_api_key
      - ES_ADDRESS=${ES_ADDRESS:-http://elasticsearch:9200}
      - ES_API_KEY=${ES_API_KEY:-}
      - ES_API_KEY_FILE=/run/secrets/es_api_key
      - ES_INDEX=${ES_INDEX:-documents_text}
      - EMBED_ENDPOINT=${EMBED_ENDPOINT:-http://host.docker.internal:11434/api/embeddings}
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - EMBED_API_KEY_FILE=/run/secrets/embed_api_key
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - EMBED_DIMENSION=${EMBED_DIMENSION:-768}
      - EMBED_RATE_LIMIT=${EMBED_RATE_LIMIT:-50}
      - RETRIEVAL_TIMEOUT=${RETRIEVAL_TIMEOUT:-300ms}
      - RETRIEVAL_CANDIDATE_K=${RETRIEVAL_CANDIDATE_K:-50}
      - RETRIEVAL_FINAL_TOP_K=${RETRIEVAL_FINAL_TOP_K:-5}
      - RETRIEVAL_ENABLE_ES=${RETRIEVAL_ENABLE_ES:-true}
      - RETRIEVAL_ENABLE_RERANK=${RETRIEVAL_ENABLE_RERANK:-false}
      - RETRIEVAL_RERANK_POLICY=${RETRIEVAL_RERANK_POLICY:-auto}
      - RETRIEVAL_EXACT_SCHEMA_FIELDS=${RETRIEVAL_EXACT_SCHEMA_FIELDS:-doc_id,chunk_id,order_id,order_no,contract_id,contract_no,ticket_id,invoice_no,trace_id,request_id,customer_ref,email,phone,sku,user_id}
      - RERANK_ENDPOINT=${RERANK_ENDPOINT:-}
      - RERANK_API_KEY=${RERANK_API_KEY:-}
      - RERANK_MODEL=${RERANK_MODEL:-bge-reranker-base}
      - SEMANTIC_CACHE_ENABLED=${SEMANTIC_CACHE_ENABLED:-true}
      - SEMANTIC_CACHE_TTL=${SEMANTIC_CACHE_TTL:-10m}
      - SEMANTIC_CACHE_THRESHOLD=${SEMANTIC_CACHE_THRESHOLD:-0.92}
      - SEMANTIC_CACHE_MAX_ENTRIES=${SEMANTIC_CACHE_MAX_ENTRIES:-128}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://host.docker.internal:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_KEY_FILE=/run/secrets/llm_api_key
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
      - LLM_PRICE_PROMPT_PER_1K=${LLM_PRICE_PROMPT_PER_1K:-0}
      - LLM_PRICE_COMPLETION_PER_1K=${LLM_PRICE_COMPLETION_PER_1K:-0}
      - PROMPT_DIR=/prompts
      - PROMPT_VERSION=${PROMPT_VERSION:-v1}
      - AGENT_NODE_ID=${AGENT_NODE_ID:-agent-api-1}
      - AGENT_MAX_STEPS=${AGENT_MAX_STEPS:-8}
      - AGENT_LOCK_TTL=${AGENT_LOCK_TTL:-30s}
      - AGENT_RUN_TTL=${AGENT_RUN_TTL:-24h}
      - AGENT_RUN_TIMEOUT=${AGENT_RUN_TIMEOUT:-30m}
      - AGENT_APPROVAL_TIMEOUT=${AGENT_APPROVAL_TIMEOUT:-15m}
      - AGENT_PLANNER_TYPE=${AGENT_PLANNER_TYPE:-auto}
      - AGENT_PLANNER_ENDPOINT=${AGENT_PLANNER_ENDPOINT:-}
      - AGENT_PLANNER_API_KEY=${AGENT_PLANNER_API_KEY:-}
      - AGENT_PLANNER_MODEL=${AGENT_PLANNER_MODEL:-}
      - AGENT_PLANNER_TIMEOUT=${AGENT_PLANNER_TIMEOUT:-30s}
      - AGENT_PLANNER_MAX_TOKENS=${AGENT_PLANNER_MAX_TOKENS:-512}
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_ACCESS_KEY_FILE=/run/secrets/s3_access_key
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_SECRET_KEY_FILE=/run/secrets/s3_secret_key
      - S3_BUCKET=documents
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    secrets:
      - jwt_secret
      - embed_api_key
      - llm_api_key
      - store_api_key
      - redis_password
      - es_api_key
      - s3_access_key
      - s3_secret_key
    depends_on:
      kafka:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-state:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - upload_data:/data/uploads
      # Versioned system prompts (PROMPT_DIR). Change PROMPT_VERSION to load a
      # different file; keeps prompt history in git for eval A/B.
      - ./prompts:/prompts:ro

  # Interview demo frontend (Next.js standalone). NEXT_PUBLIC_* are inlined at
  # build time; pass WEB_API_BASE / WEB_JWT to override.
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE: /api
        NEXT_PUBLIC_JWT: ${WEB_JWT:-}
    environment:
      # Backend for the rewrite proxy (compose-internal hostname).
      BACKEND_URL: http://query-api:8080
    ports:
      - "${WEB_HOST_PORT:-3100}:3000"
    depends_on:
      query-api:
        condition: service_healthy
    restart: unless-stopped

  # Optional CPU Cross-Encoder Reranker
  reranker-service:
    profiles:
      - rerank
    build:
      context: ./services/reranker-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${RERANKER_HOST_PORT:-8091}:8091"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-staging}
      - LOG_LEVEL=${RERANKER_LOG_LEVEL:-INFO}
      - RERANKER_BACKEND=${RERANKER_BACKEND:-cross-encoder}
      - RERANKER_MODEL=${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L6-v2}
      - RERANKER_DEVICE=${RERANKER_DEVICE:-cpu}
      - RERANKER_BATCH_SIZE=${RERANKER_BATCH_SIZE:-16}
      - RERANKER_MAX_DOCUMENTS=${RERANKER_MAX_DOCUMENTS:-100}
      - RERANKER_MAX_DOCUMENT_CHARS=${RERANKER_MAX_DOCUMENT_CHARS:-12000}
      - RERANKER_LOAD_ON_STARTUP=${RERANKER_LOAD_ON_STARTUP:-true}
    volumes:
      - reranker_cache:/models/huggingface
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

volumes:
  kafka_data:
  redis_cache_data:
  redis_state_data:
  qdrant_data:
  es_data:
  minio_data:
  upload_data:
  reranker_cache:
  grafana_data:

secrets:
  parser_internal_token:
    file: ${PARSER_INTERNAL_TOKEN_FILE_PATH:-./secrets/examples/parser_internal_token}
  jwt_secret:
    file: ${JWT_SECRET_FILE_PATH:-./secrets/examples/jwt_secret}
  embed_api_key:
    file: ${EMBED_API_KEY_FILE_PATH:-./secrets/examples/embed_api_key}
  llm_api_key:
    file: ${LLM_API_KEY_FILE_PATH:-./secrets/examples/llm_api_key}
  store_api_key:
    file: ${STORE_API_KEY_FILE_PATH:-./secrets/examples/store_api_key}
  redis_password:
    file: ${REDIS_PASSWORD_FILE_PATH:-./secrets/examples/redis_password}
  es_api_key:
    file: ${ES_API_KEY_FILE_PATH:-./secrets/examples/es_api_key}
  s3_access_key:
    file: ${S3_ACCESS_KEY_FILE_PATH:-./secrets/examples/s3_access_key}
  s3_secret_key:
    file: ${S3_SECRET_KEY_FILE_PATH:-./secrets/examples/s3_secret_key}
  alert_webhook_token:
    file: ${ALERT_WEBHOOK_TOKEN_FILE_PATH:-./secrets/examples/alert_webhook_token}
  wecom_webhook_url:
    file: ${WECOM_WEBHOOK_URL_FILE_PATH:-./secrets/examples/wecom_webhook_url}
  dingtalk_webhook_url:
    file: ${DINGTALK_WEBHOOK_URL_FILE_PATH:-./secrets/examples/dingtalk_webhook_url}
  dingtalk_secret:
    file: ${DINGTALK_SECRET_FILE_PATH:-./secrets/examples/dingtalk_secret}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE_PATH:-./secrets/examples/grafana_admin_password}
