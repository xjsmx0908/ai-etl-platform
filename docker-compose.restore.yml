# Overlay for scripts/restore-stack.sh.
#
# The restore drill runs in its own compose project (COMPOSE_PROJECT_NAME=ai-etl-restore)
# on its own volumes, so a `down -v` at the end can never touch the demo stack.
# docker-compose.eval.yml hides every backing-service host port; this overlay
# re-exposes exactly the endpoints the drill has to reach from the host, on
# ports that do not collide with a running stack.
services:
  postgres:
    ports: !override
      - "${COMPOSE_BIND:-127.0.0.1}:${RESTORE_PG_HOST_PORT:-55432}:5432"
  qdrant:
    ports: !override
      - "${COMPOSE_BIND:-127.0.0.1}:${RESTORE_QDRANT_HOST_PORT:-6335}:6333"
  elasticsearch:
    ports: !override
      - "${COMPOSE_BIND:-127.0.0.1}:${RESTORE_ES_HOST_PORT:-9202}:9200"
  minio:
    ports: !override
      - "${COMPOSE_BIND:-127.0.0.1}:${RESTORE_MINIO_HOST_PORT:-9002}:9000"
  query-api:
    ports: !override
      - "${COMPOSE_BIND:-127.0.0.1}:${RESTORE_API_HOST_PORT:-8082}:8080"
