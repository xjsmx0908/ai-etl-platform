global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: query-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - query-api:8080

  - job_name: etl-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - etl-worker:8081

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets:
          - qdrant:6333
