groups:
  - name: ai-etl-platform
    rules:
      - alert: QueryApiHighErrorRate
        expr: rate(ai_etl_http_request_duration_seconds_count{status=~"5.."}[5m]) / clamp_min(rate(ai_etl_http_request_duration_seconds_count[5m]), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Query API 5xx rate is above 5%

      - alert: QueryApiHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(ai_etl_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Query API p95 latency is above 1s

      - alert: ETLDLQGrowing
        expr: increase(ai_etl_dlq_messages_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: ETL tasks are landing in DLQ

      - alert: ESDeadLetterNonZero
        expr: increase(ai_etl_es_deadletter_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Chunks permanently failed ES indexing (Qdrant/ES divergence)
          description: >-
            Some chunks exist in the vector store but never reached the
            full-text index. Query results may silently miss full-text hits.
            Investigate ES connectivity and consider re-indexing affected docs.

      - alert: IngestionOutboxStalled
        expr: max(ai_etl_ingestion_outbox_oldest_age_seconds) > 300
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Ingestion outbox publication has been stalled for 10 minutes

      - alert: IngestionOutboxRetrying
        expr: max(ai_etl_ingestion_outbox_retried) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Ingestion outbox events continue to require publication retries

      - alert: IngestionProcessingLeaseExpired
        expr: max(ai_etl_ingestion_expired_processing_leases) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Durable ingestion work is waiting for lease recovery

      - alert: IndexGenerationBuildStalled
        expr: max by (state) (ai_etl_generation_oldest_age_seconds{state="building"}) > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: An index generation has remained building for over 15 minutes

      - alert: IndexGenerationFailed
        expr: max by (state) (ai_etl_generation_manifests{state="failed"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Failed index generation manifests require investigation

      - alert: IndexGenerationBackendDiverged
        expr: max by (condition) (ai_etl_generation_diagnostics{condition="backend_diverged"}) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Active index generations remain inconsistent across search backends

      - alert: IndexGenerationRepairExhausted
        expr: max by (condition) (ai_etl_generation_diagnostics{condition="repair_exhausted"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Automatic index generation repair attempts are exhausted

      - alert: IndexGenerationRetentionFailed
        expr: max by (condition) (ai_etl_generation_diagnostics{condition="retention_failed"}) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Retired index generation cleanup continues to fail

      - alert: DocumentDeletionStalled
        expr: max(ai_etl_deletion_oldest_age_seconds) > 1800
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: A document deletion has remained unfinished for over 30 minutes

      - alert: DocumentDeletionDependencyFailed
        expr: max by (condition) (ai_etl_deletion_diagnostics{condition="failed"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Document deletion dependency cleanup continues to fail

      - alert: DocumentDeletionLeaseExpired
        expr: max by (condition) (ai_etl_deletion_diagnostics{condition="expired_lease"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Document deletion work is waiting for lease recovery

      - alert: SCIMProvisioningFailures
        expr: increase(ai_etl_scim_requests_total{result="failure"}[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: SCIM lifecycle requests continue to fail

      - alert: SCIMSynchronizationStale
        expr: time() - ai_etl_scim_last_success_unixtime > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: No successful SCIM lifecycle request has completed for 24 hours

      - alert: CircuitBreakerOpen
        expr: ai_etl_circuit_state == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Circuit breaker is open

      - alert: LLMConsecutiveFailures
        expr: max by (model) (ai_etl_llm_consecutive_failures) >= 5
        labels:
          severity: critical
        annotations:
          summary: LLM failed at least five consecutive completed requests

      - alert: LLMHighErrorRate
        expr: |
          (
            sum by (model) (rate(ai_etl_llm_requests_total{outcome!="success"}[5m]))
            /
            clamp_min(sum by (model) (rate(ai_etl_llm_requests_total[5m])), 0.001)
          ) > 0.20
          and on (model)
          sum by (model) (increase(ai_etl_llm_requests_total[5m])) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: LLM error rate is above 20% with at least 10 requests in 5m

      - alert: LLMHighLatency
        expr: histogram_quantile(0.95, sum by (model, le) (rate(ai_etl_llm_request_duration_seconds_bucket[5m]))) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: LLM request p95 latency is above 10s

      - alert: AgentRunFailures
        expr: increase(ai_etl_agent_run_completions_total{state="failed"}[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Agent run failures exceeded 3 in 15m

      - alert: AgentLifecycleTimeouts
        expr: increase(ai_etl_agent_run_completions_total{error_type=~"run_timeout_exceeded|approval_timeout_exceeded"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Agent lifecycle timeout occurred

      - alert: AgentRunHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(ai_etl_agent_run_duration_seconds_bucket[10m]))) > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Agent run p95 duration is above 60s
