groups:
  - name: ai-etl-platform
    rules:
      - alert: QueryApiHighErrorRate
        expr: rate(ai_etl_http_request_duration_seconds_count{status=~"5.."}[5m]) / clamp_min(rate(ai_etl_http_request_duration_seconds_count[5m]), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Query API 5xx rate is above 5%

      - alert: QueryApiHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(ai_etl_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Query API p95 latency is above 1s

      - alert: ETLDLQGrowing
        expr: increase(ai_etl_dlq_messages_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: ETL tasks are landing in DLQ

      - alert: ESDeadLetterNonZero
        expr: increase(ai_etl_es_deadletter_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Chunks permanently failed ES indexing (Qdrant/ES divergence)
          description: >-
            Some chunks exist in the vector store but never reached the
            full-text index. Query results may silently miss full-text hits.
            Investigate ES connectivity and consider re-indexing affected docs.

      # Deliberately no `for`: a drop is irreversible loss of the only record of
      # which chunks never reached the full-text index, so waiting out a 15m
      # window only delays the page. ESDeadLetterNonZero above says chunks are
      # failing; this says the buffer holding them has overflowed and is now
      # discarding the oldest evidence.
      #
      # There is no threshold alert on ai_etl_es_deadletter_depth on purpose.
      # Nothing consumes that list by design, so a non-zero depth is a standing
      # backlog rather than an event - an alert on it would fire forever and be
      # tuned out. Depth belongs on the panel; this counter is the pageable one.
      - alert: ESDeadLetterDropped
        expr: increase(ai_etl_es_deadletter_dropped_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: ES dead-letter queue overflowed and discarded diagnostic records
          description: >-
            The dead-letter list reached ES_DEADLETTER_MAX and trimmed its oldest
            entries, so part of the record of what failed to index is gone. Raise
            the cap, or fix the ES outage that is producing the entries, before
            the list fills again.

      - alert: IngestionOutboxStalled
        expr: max(ai_etl_ingestion_outbox_oldest_age_seconds) > 300
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Ingestion outbox publication has been stalled for 10 minutes

      - alert: IngestionOutboxRetrying
        expr: max(ai_etl_ingestion_outbox_retried) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Ingestion outbox events continue to require publication retries

      - alert: IngestionProcessingLeaseExpired
        expr: max(ai_etl_ingestion_expired_processing_leases) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Durable ingestion work is waiting for lease recovery

      - alert: IndexGenerationBuildStalled
        expr: max by (state) (ai_etl_generation_oldest_age_seconds{state="building"}) > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: An index generation has remained building for over 15 minutes

      - alert: IndexGenerationFailed
        expr: max by (state) (ai_etl_generation_manifests{state="failed"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Failed index generation manifests require investigation

      - alert: IndexGenerationBackendDiverged
        expr: max by (condition) (ai_etl_generation_diagnostics{condition="backend_diverged"}) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Active index generations remain inconsistent across search backends

      - alert: IndexGenerationRepairExhausted
        expr: max by (condition) (ai_etl_generation_diagnostics{condition="repair_exhausted"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Automatic index generation repair attempts are exhausted

      - alert: IndexGenerationRetentionFailed
        expr: max by (condition) (ai_etl_generation_diagnostics{condition="retention_failed"}) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Retired index generation cleanup continues to fail

      - alert: DocumentDeletionStalled
        expr: max(ai_etl_deletion_oldest_age_seconds) > 1800
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: A document deletion has remained unfinished for over 30 minutes

      - alert: DocumentDeletionDependencyFailed
        expr: max by (condition) (ai_etl_deletion_diagnostics{condition="failed"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Document deletion dependency cleanup continues to fail

      - alert: DocumentDeletionLeaseExpired
        expr: max by (condition) (ai_etl_deletion_diagnostics{condition="expired_lease"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Document deletion work is waiting for lease recovery

      - alert: SCIMProvisioningFailures
        expr: increase(ai_etl_scim_requests_total{result="failure"}[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: SCIM lifecycle requests continue to fail

      - alert: SCIMSynchronizationStale
        expr: time() - ((ai_etl_scim_last_success_unixtime > 0) or on(connector) ai_etl_scim_enabled_since_unixtime) > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: No successful SCIM lifecycle request has completed for 24 hours

      - alert: CircuitBreakerOpen
        expr: ai_etl_circuit_state == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Circuit breaker is open

      - alert: LLMConsecutiveFailures
        expr: max by (model) (ai_etl_llm_consecutive_failures) >= 5
        labels:
          severity: critical
        annotations:
          summary: LLM failed at least five consecutive completed requests

      - alert: LLMHighErrorRate
        expr: |
          (
            sum by (model) (rate(ai_etl_llm_requests_total{outcome!="success"}[5m]))
            /
            clamp_min(sum by (model) (rate(ai_etl_llm_requests_total[5m])), 0.001)
          ) > 0.20
          and on (model)
          sum by (model) (increase(ai_etl_llm_requests_total[5m])) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: LLM error rate is above 20% with at least 10 requests in 5m

      - alert: LLMHighLatency
        expr: histogram_quantile(0.95, sum by (model, le) (rate(ai_etl_llm_request_duration_seconds_bucket[5m]))) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: LLM request p95 latency is above 10s

      - alert: GovernanceNotificationOutboxStalled
        expr: max(ai_etl_notification_outbox_oldest_age_seconds) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Governance notification outbox has been stalled for 10 minutes

      - alert: AgentRunFailures
        expr: increase(ai_etl_agent_run_completions_total{state="failed"}[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Agent run failures exceeded 3 in 15m

      - alert: AgentLifecycleTimeouts
        expr: increase(ai_etl_agent_run_completions_total{error_type=~"run_timeout_exceeded|approval_timeout_exceeded"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Agent lifecycle timeout occurred

      - alert: AgentRunHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(ai_etl_agent_run_duration_seconds_bucket[10m]))) > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Agent run p95 duration is above 60s

      - alert: ReleaseCenterHighErrorRate
        expr: |
          (
            sum(rate(ai_etl_http_request_duration_seconds_count{path=~"/v1/release-center.*",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(ai_etl_http_request_duration_seconds_count{path=~"/v1/release-center.*"}[5m])), 0.001)
          ) > 0.05
          and sum(increase(ai_etl_http_request_duration_seconds_count{path=~"/v1/release-center.*"}[5m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Knowledge Release Center API 5xx rate is above 5%

      # A refusal is a successful HTTP 200 that carries no sources, so neither
      # QueryApiHighErrorRate nor QueryApiHighLatency can see it. This is the
      # only rule that notices "the system stopped answering".
      #
      # The threshold is deliberately near 1 rather than a "reasonable" share:
      # refusing an off-corpus question is correct behaviour, so any threshold
      # low enough to catch a slow decline would also fire on ordinary traffic.
      # At 90% the cause is not a judgement call - one reason dominates, and
      # the reason label names the component behind it.
      - alert: QueryRefusalRateNearTotal
        expr: |
          sum(rate(ai_etl_query_refusals_total[15m]))
          /
          clamp_min(sum(rate(ai_etl_query_duration_seconds_count[15m])), 1) > 0.9
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Nearly every query is being refused
          description: >-
            More than 90% of finished queries were refused. Break the reason
            down with
            sum by (reason) (rate(ai_etl_query_refusals_total[15m])) :
            evidence_filtered rising means documents stopped being published,
            insufficient_support means the grounding check started rejecting
            everything, sensitive_content means the output filter is tripping on
            ordinary answers, and no_evidence means retrieval returned nothing.

      - alert: QueryFailuresNonZero
        expr: sum by (stage) (increase(ai_etl_query_failures_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Queries are failing at stage {{ $labels.stage }}
          description: >-
            The query pipeline is returning 5xx. The stage label names the
            component that broke: retrieval, generation, knowledge_catalog or
            internal. Authorization rejections are not counted here.
