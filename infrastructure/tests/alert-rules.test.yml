rule_files:
  - ../rules/etl-alerts.yml

evaluation_interval: 1m

tests:
  - name: five consecutive LLM failures trigger a critical alert
    interval: 1m
    input_series:
      - series: 'ai_etl_llm_consecutive_failures{instance="query-api:8080",model="qwen2.5:7b"}'
        values: '0 1 2 3 4 5'
    alert_rule_test:
      - eval_time: 4m
        alertname: LLMConsecutiveFailures
        exp_alerts: []
      - eval_time: 5m
        alertname: LLMConsecutiveFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              model: qwen2.5:7b
            exp_annotations:
              summary: LLM failed at least five consecutive completed requests

  - name: a successful LLM request clears the consecutive failure alert
    interval: 1m
    input_series:
      - series: 'ai_etl_llm_consecutive_failures{instance="query-api:8080",model="qwen2.5:7b"}'
        values: '5 0'
    alert_rule_test:
      - eval_time: 0m
        alertname: LLMConsecutiveFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              model: qwen2.5:7b
            exp_annotations:
              summary: LLM failed at least five consecutive completed requests
      - eval_time: 1m
        alertname: LLMConsecutiveFailures
        exp_alerts: []

  - name: sustained ingestion outbox backlog triggers operational alerts
    interval: 1m
    input_series:
      - series: 'ai_etl_ingestion_outbox_oldest_age_seconds{instance="query-api:8080"}'
        values: '360 360 360 360 360 360 360 360 360 360 360'
      - series: 'ai_etl_ingestion_outbox_retried{instance="query-api:8080"}'
        values: '2 2 2 2 2 2 2 2 2 2 2'
    alert_rule_test:
      - eval_time: 9m
        alertname: IngestionOutboxStalled
        exp_alerts: []
      - eval_time: 10m
        alertname: IngestionOutboxStalled
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Ingestion outbox publication has been stalled for 10 minutes
      - eval_time: 10m
        alertname: IngestionOutboxRetrying
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Ingestion outbox events continue to require publication retries

  - name: expired processing lease triggers recovery alert
    interval: 1m
    input_series:
      - series: 'ai_etl_ingestion_expired_processing_leases{instance="query-api:8080"}'
        values: '1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: IngestionProcessingLeaseExpired
        exp_alerts: []
      - eval_time: 5m
        alertname: IngestionProcessingLeaseExpired
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Durable ingestion work is waiting for lease recovery

  - name: stalled generation build and failed manifest trigger operational alerts
    interval: 1m
    input_series:
      - series: 'ai_etl_generation_oldest_age_seconds{instance="etl-worker:8081",state="building"}'
        values: '1200x16'
      - series: 'ai_etl_generation_manifests{instance="etl-worker:8081",state="failed"}'
        values: '2x16'
    alert_rule_test:
      - eval_time: 9m
        alertname: IndexGenerationBuildStalled
        exp_alerts: []
      - eval_time: 10m
        alertname: IndexGenerationBuildStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              state: building
            exp_annotations:
              summary: An index generation has remained building for over 15 minutes
      - eval_time: 15m
        alertname: IndexGenerationFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              state: failed
            exp_annotations:
              summary: Failed index generation manifests require investigation

  - name: persistent projection divergence and exhausted repair trigger critical alerts
    interval: 1m
    input_series:
      - series: 'ai_etl_generation_diagnostics{instance="etl-worker:8081",condition="backend_diverged"}'
        values: '1x11'
      - series: 'ai_etl_generation_diagnostics{instance="etl-worker:8081",condition="repair_exhausted"}'
        values: '1x11'
    alert_rule_test:
      - eval_time: 9m
        alertname: IndexGenerationBackendDiverged
        exp_alerts: []
      - eval_time: 10m
        alertname: IndexGenerationBackendDiverged
        exp_alerts:
          - exp_labels:
              severity: critical
              condition: backend_diverged
            exp_annotations:
              summary: Active index generations remain inconsistent across search backends
      - eval_time: 5m
        alertname: IndexGenerationRepairExhausted
        exp_alerts:
          - exp_labels:
              severity: critical
              condition: repair_exhausted
            exp_annotations:
              summary: Automatic index generation repair attempts are exhausted

  - name: persistent retired generation cleanup failures trigger warning
    interval: 1m
    input_series:
      - series: 'ai_etl_generation_diagnostics{instance="etl-worker:8081",condition="retention_failed"}'
        values: '2x31'
    alert_rule_test:
      - eval_time: 29m
        alertname: IndexGenerationRetentionFailed
        exp_alerts: []
      - eval_time: 30m
        alertname: IndexGenerationRetentionFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              condition: retention_failed
            exp_annotations:
              summary: Retired index generation cleanup continues to fail

  - name: durable deletion failures and expired leases trigger alerts
    interval: 1m
    input_series:
      - series: 'ai_etl_deletion_oldest_age_seconds{instance="etl-worker:8081"}'
        values: '1900x11'
      - series: 'ai_etl_deletion_diagnostics{instance="etl-worker:8081",condition="failed"}'
        values: '1x11'
      - series: 'ai_etl_deletion_diagnostics{instance="etl-worker:8081",condition="expired_lease"}'
        values: '1x11'
    alert_rule_test:
      - eval_time: 10m
        alertname: DocumentDeletionStalled
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: A document deletion has remained unfinished for over 30 minutes
      - eval_time: 10m
        alertname: DocumentDeletionDependencyFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              condition: failed
            exp_annotations:
              summary: Document deletion dependency cleanup continues to fail
      - eval_time: 5m
        alertname: DocumentDeletionLeaseExpired
        exp_alerts:
          - exp_labels:
              severity: critical
              condition: expired_lease
            exp_annotations:
              summary: Document deletion work is waiting for lease recovery
