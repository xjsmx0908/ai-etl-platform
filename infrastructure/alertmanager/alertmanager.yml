global:
  resolve_timeout: 5m

route:
  receiver: enterprise-notifications
  group_by:
    - alertname
    - model
    - severity
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      group_wait: 5s
      repeat_interval: 30m

receivers:
  - name: enterprise-notifications
    webhook_configs:
      - url: http://alert-webhook-service:8092/alerts
        send_resolved: true
        max_alerts: 20
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alert_webhook_token

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - model
