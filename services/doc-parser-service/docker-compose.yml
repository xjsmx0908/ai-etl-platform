# ============================================================
# docker-compose.yml - Parser Service 独立测试
# ============================================================

services:
  parser-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro  # 挂载文档目录（只读）
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MIN_CHUNK_SIZE=128
      - MAX_CHUNK_SIZE=4000
      - CHUNK_OVERLAP=200
      - MAX_FILE_SIZE_MB=100
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
