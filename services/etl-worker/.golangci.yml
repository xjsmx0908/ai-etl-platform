run:
  timeout: 5m
  go: "1.21"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - gocritic
    - gofmt
    - misspell

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    check-shadowing: false
  gocritic:
    enabled-tags:
      - diagnostic
      - performance

issues:
  exclude-rules:
    # Allow unchecked errors in test files
    - path: _test\.go
      linters:
        - errcheck
    # Allow unused parameters in interface implementations
    - linters:
        - unused
      source: "^func .* _ context\\.Context"
  max-issues-per-linter: 50
  max-same-issues: 5
