name: E2E Smoke

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    name: Full Pipeline Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run end-to-end smoke test
        run: scripts/e2e-smoke.sh
        env:
          MAX_WAIT_SECONDS: 240

      - name: Run ingestion crash-recovery acceptance
        run: scripts/e2e-ingestion-crash.sh
        env:
          MAX_WAIT_SECONDS: 240
