name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go Checks (etl-worker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INDEX_MANIFEST_TEST_DSN: postgres://test:test@localhost:5432/test?sslmode=disable
      GOVERNANCE_RELEASE_TEST_DSN: postgres://test:test@localhost:5432/test?sslmode=disable
      EXTERNAL_IDENTITY_TEST_DSN: postgres://test:test@localhost:5432/test?sslmode=disable
      IDENTITY_LIFECYCLE_TEST_DSN: postgres://test:test@localhost:5432/test?sslmode=disable
      SESSION_TEST_DSN: postgres://test:test@localhost:5432/test?sslmode=disable
      OIDC_REDIS_TEST_ADDR: localhost:6379
    defaults:
      run:
        working-directory: services/etl-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/etl-worker/go.mod
          cache-dependency-path: services/etl-worker/go.sum

      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Unformatted files:"
            echo "$files"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -count=1

  eval:
    name: Deterministic RAG Eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install script test dependencies
        run: python3 -m pip install -r scripts/requirements-test.txt

      - name: Run eval unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Run deterministic eval
        run: python3 scripts/run-evals.py --min-hit-rate 0.90 --min-pass-rate 0.90 --min-answer-pass-rate 0.90 --min-negative-pass-rate 1.00 --max-wait 180

  python:
    name: Python Tests (doc-parser-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/doc-parser-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/doc-parser-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

  reranker:
    name: Python Tests (reranker-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/reranker-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/reranker-service/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run pytest
        env:
          RERANKER_BACKEND: lexical
          RERANKER_LOAD_ON_STARTUP: "false"
        run: pytest -q

  web:
    name: Web Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # This contract is a Python unittest in scripts/tests, but it drives a node
      # harness that transpiles web/lib/querySSE.ts with the TypeScript compiler
      # out of web/node_modules. This job is where that directory exists, so the
      # contract runs here; the `eval` job skips it through RUN_QUERY_SSE_HARNESS
      # instead of failing on a module that job never installs.
      #
      # It is not gated on the directory existing, deliberately. A directory
      # check would let a runner that forgot `npm ci` skip the contract and
      # still report green, which is the failure this step exists to end: the
      # contract was red in `eval` on every push and green on any machine that
      # happened to have node_modules.
      - name: Test query SSE client contract
        run: npm run test:sse

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test reauthentication HTTP and cookie contract
        run: npm run test:reauth

  compose:
    name: Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config > /dev/null

      - name: Validate isolated eval Compose overlay
        run: |
          COMPOSE_FILE=docker-compose.yml:docker-compose.eval.yml \
          QUERY_API_HOST_PORT=0 \
          docker compose config > /dev/null

  # Cross-layer index consistency.
  #
  # Four layers describe the same documents -- the registry (documents /
  # index_manifests), the vectors (Qdrant), the full-text index
  # (Elasticsearch) and the chunks endpoint the UI reads -- and nothing in this
  # repository compares them. A published document can therefore be visible in
  # one layer and invisible in another with no test, alert or reconcile job
  # noticing; the manifest reconciler only covers documents that have a
  # manifest row, so anything that never got one is outside its reach by
  # construction.
  #
  # That is not hypothetical. On 2026-09-02 the Elasticsearch disk crossed the
  # flood-stage watermark, the index was flipped to read-only-allow-delete and
  # every write answered 429. The sink retried, exhausted its attempts, and
  # moved the messages to `es:index:deadletter` -- a Redis list that only ever
  # gets written to. Two published documents stayed invisible to keyword search
  # for three weeks. `scripts/check-index-consistency.py` is what would have
  # caught it; this job is what makes it run without a person remembering to.
  #
  # The check runs inside the compose network because docker-compose.eval.yml
  # deliberately resets the backend ports to nothing (`ports: !reset []`), so
  # Elasticsearch and Qdrant are not reachable from the runner. Only the query
  # API is, on a random loopback port, which is enough to mint a token.
  #
  # COMPOSE_FILE and COMPOSE_PROJECT_NAME sit at job level, not on the seed step.
  # Every later step runs `docker compose`, and without them it resolves against
  # the *default* project: on a host that also runs the demo stack, `docker compose
  # port query-api 8080` answers 8080 and the check silently reads the demo
  # deployment; on a bare runner it answers nothing and the step fails.
  #
  # Nothing about the stack is re-declared below. The tenant, the bootstrap admin
  # and the store names all come from `docs/evals/reports/stack-descriptor.json`,
  # which the eval runner writes once its own admin login succeeds. Every value
  # here was guessed at first and each guess produced a wrong answer rather than
  # an error: the bootstrap admin is `eval-admin` (not `admin`, so the login was a
  # 401), and a freshly built stack's collection is `documents` while the
  # long-running demo tenant's is `documents-v2` (so the check asked for a
  # collection that does not exist and reported a 404 on all 47 documents).
  #
  # This job is now in `required-checks`, which is a deliberate cost: it takes
  # about 23 minutes on a cold runner because it builds and seeds a whole stack.
  # It is the only thing in the repository that compares the four layers, so a
  # red here has to block rather than sit in a list nobody reads -- which is
  # exactly where it sat from the commit that introduced it until 2026-09-26.
  index-consistency:
    name: Cross-layer Index Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.eval.yml
      COMPOSE_PROJECT_NAME: ai-etl-consistency
      STACK_DESCRIPTOR: docs/evals/reports/stack-descriptor.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Seed an isolated stack through the eval runner, which already knows how
      # to bring the overlay up, create the eval users and publish documents.
      # The rate floors are zeroed on purpose: this job measures layer
      # agreement, not answer quality, and a red here should mean the layers
      # disagree rather than that an answer drifted.
      #
      # The output is tee'd to a file so the failure can be published in the next
      # step. A red here is most often "the stack did not come up", and that
      # reason lives in this step's output -- which is not readable through the
      # API without a token.
      - name: Seed an isolated stack through the eval runner
        run: |
          set -o pipefail
          python3 scripts/run-evals.py \
            --keep-services \
            --compose-project ai-etl-consistency \
            --min-hit-rate 0 --min-pass-rate 0 \
            --min-answer-pass-rate 0 --min-negative-pass-rate 0 2>&1 | tee /tmp/seed.log

      # The reason a red here matters is almost always in this step's output, and
      # a job log is not readable without a token. An annotation is: it is what
      # the checks API returns. Newlines travel as `%0A`, and a literal `%` has to
      # be escaped first or the message gets cut at it.
      - name: Publish why the stack did not come up
        if: failure()
        run: |
          tail -40 /tmp/seed.log 2>/dev/null | tr -d '\r' \
            | sed -e 's/%/%25/g' \
            | awk '{printf "%s%%0A", $0}' > /tmp/seed-annotation
          message="$(cat /tmp/seed-annotation)"
          if [ -z "$message" ]; then
            message="(no seed log was produced)"
          fi
          echo "::error title=the seed step failed::$message"

      - name: Mint an admin token
        run: |
          if [ ! -f "$STACK_DESCRIPTOR" ]; then
            echo "the eval runner did not write $STACK_DESCRIPTOR; the stack did not come up" >&2
            exit 1
          fi
          port="$(docker compose port query-api 8080 | head -1 | sed 's/.*://')"
          if [ -z "$port" ]; then
            echo "query-api has no published port; the stack did not come up" >&2
            exit 1
          fi
          token="$(curl -fsS --noproxy '*' -X POST "http://127.0.0.1:${port}/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "$(jq -c '{username: .admin_username, password: .admin_password}' "$STACK_DESCRIPTOR")" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          echo "::add-mask::${token}"
          echo "AI_ETL_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Read the store API key
        run: |
          key="$(docker compose exec -T qdrant cat /run/secrets/store_api_key | tr -d '\r\n')"
          echo "::add-mask::${key}"
          echo "QDRANT_API_KEY=${key}" >> "$GITHUB_ENV"

      # No --baseline here on purpose. The baseline in scripts/ describes the
      # long-running demo tenant, where a set of legacy points is known and
      # attributed. This stack is built fresh by the step above, so every
      # inconsistency it finds is a new one and the check should fail on it.
      #
      # --collection and --es-index are passed rather than defaulted for the same
      # reason: both defaults name the demo tenant's stores, and the names a fresh
      # stack uses are in the descriptor.
      - name: Run the consistency check inside the compose network
        run: |
          collection="$(jq -r .store_collection "$STACK_DESCRIPTOR")"
          es_index="$(jq -r .es_index "$STACK_DESCRIPTOR")"
          echo "checking collection=${collection} es_index=${es_index}"
          mkdir -p artifacts/index-consistency
          docker run --rm \
            --network ai-etl-consistency_default \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/artifacts/index-consistency:/reports" \
            -e AI_ETL_TOKEN \
            -e QDRANT_API_KEY \
            python:3.12-alpine \
            python /scripts/check-index-consistency.py \
              --api-base http://query-api:8080 \
              --es http://elasticsearch:9200 \
              --es-index "${es_index}" \
              --qdrant http://qdrant:6333 \
              --collection "${collection}" \
              --report-dir /reports

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-consistency-report
          path: artifacts/index-consistency/
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  observability:
    name: Observability Config and Alert Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test alert webhook service
        working-directory: services/alert-webhook-service
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test alert webhook secret permissions
        run: |
          docker build -t ai-etl-alert-webhook-test services/alert-webhook-service
          sh services/alert-webhook-service/tests/test_entrypoint.sh ai-etl-alert-webhook-test

      - name: Test Alertmanager secret permissions
        run: |
          docker build -t ai-etl-alertmanager-test infrastructure/alertmanager
          sh infrastructure/alertmanager/test-entrypoint.sh ai-etl-alertmanager-test

      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool infrastructure/grafana/dashboards/ai-etl-platform.json > /dev/null

      # `promtool check config` reads every file the config references, and
      # prometheus.yml points at two runtime secrets under /run/secrets
      # (metrics_token, store_api_key) that the real deployment mounts and this
      # container does not. A bare run therefore fails with
      # `stat /run/secrets/metrics_token: no such file or directory` on every
      # push, for a reason that says nothing about the config itself.
      #
      # --syntax-only would silence that too, but it also stops validating the
      # rule files, TLS files and credential files the config references, which
      # is most of what this step is for. Placeholders keep the check whole.
      #
      # The placeholder paths are derived from prometheus.yml rather than listed
      # here, so the step cannot go stale: a secret added to the config without
      # a placeholder fails the check loudly instead of passing quietly. The
      # `/run/secrets/` prefix is stripped because the directory is mounted *at*
      # `/run/secrets` -- keeping the prefix would nest it one level too deep and
      # the check would report the file as missing.
      #
      # `chmod a+rX` is not decoration. `mktemp -d` makes a 0700 directory and
      # the prometheus image runs as `nobody`, so without it the check fails with
      # `permission denied` instead of passing -- a different message for the
      # same reason. Both failure modes were measured on a real host.
      - name: Validate Prometheus config and alert rules
        run: |
          secrets="$(mktemp -d)"
          grep -oE '/run/secrets/[A-Za-z0-9_.-]+' infrastructure/prometheus.yml \
            | sort -u \
            | while read -r path; do
                printf 'ci-placeholder\n' > "${secrets}/${path#/run/secrets/}"
              done
          chmod -R a+rX "${secrets}"
          docker run --rm \
            -v "$PWD/infrastructure:/work:ro" \
            -v "${secrets}:/run/secrets:ro" \
            --entrypoint promtool \
            prom/prometheus:latest \
            check config /work/prometheus.yml
          docker run --rm \
            -v "$PWD/infrastructure:/work:ro" \
            -w /work/tests \
            --entrypoint promtool \
            prom/prometheus:latest \
            test rules alert-rules.test.yml

      - name: Validate Alertmanager config
        run: |
          docker run --rm \
            -v "$PWD/infrastructure/alertmanager:/work:ro" \
            --entrypoint amtool \
            prom/alertmanager:v0.33.1 \
            check-config /work/alertmanager.yml

  trivy:
    name: Trivy Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy vulnerability scan (CRITICAL)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            aquasec/trivy:0.57.1 \
            fs \
            -q \
            --severity CRITICAL \
            --ignore-unfixed \
            --scanners vuln \
            --exit-code 1 \
            .

      - name: Trivy misconfiguration scan (CRITICAL)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            aquasec/trivy:0.57.1 \
            config \
            -q \
            --severity CRITICAL \
            --exit-code 1 \
            .

  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - go
      - eval
      - python
      - reranker
      - web
      - compose
      - observability
      - trivy
      - index-consistency
    steps:
      - name: Enforce all required jobs passed
        run: |
          echo "go=${{ needs.go.result }}"
          echo "eval=${{ needs.eval.result }}"
          echo "python=${{ needs.python.result }}"
          echo "reranker=${{ needs.reranker.result }}"
          echo "web=${{ needs.web.result }}"
          echo "compose=${{ needs.compose.result }}"
          echo "observability=${{ needs.observability.result }}"
          echo "trivy=${{ needs.trivy.result }}"
          echo "index-consistency=${{ needs.index-consistency.result }}"

          [ "${{ needs.go.result }}" = "success" ] || exit 1
          [ "${{ needs.eval.result }}" = "success" ] || exit 1
          [ "${{ needs.python.result }}" = "success" ] || exit 1
          [ "${{ needs.reranker.result }}" = "success" ] || exit 1
          [ "${{ needs.web.result }}" = "success" ] || exit 1
          [ "${{ needs.compose.result }}" = "success" ] || exit 1
          [ "${{ needs.observability.result }}" = "success" ] || exit 1
          [ "${{ needs.trivy.result }}" = "success" ] || exit 1
          [ "${{ needs.index-consistency.result }}" = "success" ] || exit 1
