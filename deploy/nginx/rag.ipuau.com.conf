server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rag.ipuau.com;

    ssl_certificate /etc/letsencrypt/live/rag.ipuau.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.ipuau.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The API accepts files up to 512 MiB; leave room for multipart framing.
    client_max_body_size 520m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name rag.ipuau.com;
    return 301 https://$host$request_uri;
}
