server {
    listen 3443 ssl;
    server_name ai-etl.localhost;

    ssl_certificate /run/identity-demo/web.pem;
    ssl_certificate_key /run/identity-demo/web-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 100m;

    location /scim/ {
        proxy_pass http://query-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 3443;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 3443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect ~^https?://[^/]+:3000(/.*)$ https://ai-etl.localhost:3443$1;
    }
}
