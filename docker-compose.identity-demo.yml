services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)";
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: demo-admin
      KC_HOSTNAME: https://keycloak.localhost:8443
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /run/identity-demo/keycloak.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/identity-demo/keycloak-key.pem
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ${IDENTITY_DEMO_ASSET_DIR:-./secrets/dev/identity-demo}:/run/identity-demo:ro
      - ${IDENTITY_DEMO_ASSET_DIR:-./secrets/dev/identity-demo}/realm.json:/opt/keycloak/data/import/realm.json:ro
      - keycloak_demo_data:/opt/keycloak/data
    secrets:
      - source: keycloak_admin_password
        target: keycloak_admin_password
    networks:
      default:
        aliases:
          - keycloak.localhost
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  query-api:
    user: "${IDENTITY_DEMO_RUNTIME_UID:-1000}:${IDENTITY_DEMO_RUNTIME_GID:-1000}"
    ports: !reset []
    environment:
      - ENVIRONMENT=dev
      - IDENTITY_POLICY_PROFILE=personal-demo-v1
      - SESSION_CORE_ENABLED=true
      - SESSION_MAX_ACTIVE_SESSIONS=3
      - OIDC_ENABLED=true
      - OIDC_ISSUER=https://keycloak.localhost:8443/realms/ai-etl-demo
      - OIDC_CLIENT_ID=rag-web
      - OIDC_CLIENT_SECRET=
      - OIDC_CLIENT_SECRET_FILE=/run/secrets/oidc_client_secret
      - OIDC_REDIRECT_URI=https://ai-etl.localhost:3443/api/auth/oidc/callback
      - OIDC_LOGOUT_REDIRECT_URI=https://ai-etl.localhost:3443/api/auth/logout/callback
      - SSL_CERT_FILE=/run/identity-demo/ca.pem
      - SCIM_ENABLED=true
      - SCIM_CONNECTOR_ID=demo-keycloak
      - SCIM_TENANT_ID=default
      - SCIM_ISSUER=https://keycloak.localhost:8443/realms/ai-etl-demo
      - SCIM_SUBJECT_ATTRIBUTE=externalId
      - SCIM_DEFAULT_ROLE=readonly
      - SCIM_BEARER_TOKENS=
      - SCIM_BEARER_TOKENS_FILE=/run/secrets/scim_bearer_tokens
      - CORS_ALLOWED_ORIGINS=https://ai-etl.localhost:3443
    volumes:
      - upload_data:/data/uploads
      - ./prompts:/prompts:ro
      - ${IDENTITY_DEMO_ASSET_DIR:-./secrets/dev/identity-demo}/ca.pem:/run/identity-demo/ca.pem:ro
    depends_on:
      keycloak:
        condition: service_healthy

  web:
    ports: !reset []
    environment:
      BACKEND_URL: http://query-api:8080
      COOKIE_SECURE: "true"
      SESSION_CORE_ENABLED: "true"

  identity-demo-gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3443:3443"
    volumes:
      - ./deploy/identity-demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${IDENTITY_DEMO_ASSET_DIR:-./secrets/dev/identity-demo}/web.pem:/run/identity-demo/web.pem:ro
      - ${IDENTITY_DEMO_ASSET_DIR:-./secrets/dev/identity-demo}/web-key.pem:/run/identity-demo/web-key.pem:ro
    depends_on:
      web:
        condition: service_started
      query-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  keycloak_demo_data:

secrets:
  oidc_client_secret:
    file: ${IDENTITY_DEMO_ASSET_DIR:-./secrets/dev/identity-demo}/oidc-client-secret
  scim_bearer_tokens:
    file: ${IDENTITY_DEMO_ASSET_DIR:-./secrets/dev/identity-demo}/scim-bearer-token
  keycloak_admin_password:
    file: ${IDENTITY_DEMO_ASSET_DIR:-./secrets/dev/identity-demo}/keycloak-admin-password
